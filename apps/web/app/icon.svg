<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="QRCDN">
  <!--
    QRCDN brand mark (components/brand/marks.tsx's ModuleMark, board-supplied
    at the P9.10-D1 close-out, 2026-08-08) on a dark tile. The tile exists
    because the mark itself is white-gradient: on a transparent background it
    would vanish against light browser chrome, and the product is dark-only
    (P9.9-C0.6), so the tile IS the brand field. Fixed sRGB hex only —
    favicons have no CSS cascade, and exported brand assets are never oklch
    (CLAUDE.md hard rule). Tile #101013 is the dark --qr-bg literal
    (globals.css), the same near-black the product's QR paper uses.
    The gradient is the mark's own spec: #E7E7E7 -> #FFFFFF, bottom to top.
  -->
  <defs>
    <linearGradient id="mm" x1="16" y1="28" x2="16" y2="4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E7E7E7"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#101013"/>

name: CI

on:
  push:
    branches: [main]
    # Docs-only commits cost zero Actions minutes (A0, board directive on
    # Actions burn). A push mixing code + docs still runs normally.
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:

# Burst pushes (our per-unit commit cadence) cancel superseded runs instead
# of finishing them — the local lint/typecheck/test pass before every push is
# the primary gate; CI is the backstop, so only the newest run matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The pgTAP/RLS job lives in rls.yml, path-gated to supabase/** — it boots
  # the full local Supabase Docker stack (~5-7 runner-min), which is pure
  # waste on the ~80% of pushes that never touch SQL.
  # Playwright e2e job lands in P10.

# Nightly database backup — D15's stopgap until Supabase Pro's managed
# backups take over ("first real customers" trigger). The live project is on
# the free tier, which has NO automatic backups; this workflow is currently
# the only thing standing between the production DB and unrecoverable loss.
#
# Mechanics: supabase CLI `db dump` over a direct connection string stored as
# the SUPABASE_DB_URL repo secret (Project Settings → Database → Connection
# string → session mode on :5432 — NOT the :6543 transaction pooler, which is
# incompatible with pg_dump-style operations). Dumps land as private-repo
# Actions artifacts with 14-day retention.
#
# Honest exposure note: artifacts are unencrypted and gated only by repo read
# access (repo is private). Acceptable as a stopgap; retire this whole file
# when Supabase Pro lands. If [db.network_restrictions] is ever enabled in
# the Supabase project, GH runner IPs will be blocked and this job will start
# failing — that's the first place to look.

name: Nightly DB backup

on:
  schedule:
    - cron: "17 7 * * *" # 07:17 UTC — off the top-of-hour GH congestion, ~2h before the 09:00 retention purge
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL secret is not set — backup cannot run." >&2
            exit 1
          fi
          supabase db dump --db-url "$SUPABASE_DB_URL" -f "qrcdn-backup-$(date -u +%Y%m%d).sql"
          ls -lh qrcdn-backup-*.sql
      - uses: actions/upload-artifact@v4
        with:
          name: qrcdn-db-backup-${{ github.run_id }}
          path: qrcdn-backup-*.sql
          retention-days: 14
          if-no-files-found: error
